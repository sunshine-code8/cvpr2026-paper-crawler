name: Update CVPR 2026 papers

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Crawl and classify
        run: cvpr2026 --output-dir output
      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update CVPR 2026 paper index"
          file_pattern: "output/**"
